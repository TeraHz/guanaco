<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guanaco Feature Graphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background: radial-gradient(circle at 80% 30%, #3B1B6D 0%, #170C2E 40%, #0A0614 100%);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #FFFFFF;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 64px;
    }

    /* Ambient lighting and grid */
    .glow-orb-1 {
      position: absolute;
      top: -80px;
      right: 120px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.45) 0%, rgba(139, 92, 246, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
    }
    .glow-orb-2 {
      position: absolute;
      bottom: -100px;
      left: 100px;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, rgba(79, 70, 229, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    /* Content Area */
    .content-left {
      position: relative;
      z-index: 2;
      max-width: 530px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #C4B5FD;
      width: fit-content;
    }
    .brand-pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
    }

    .title {
      font-size: 58px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #FFFFFF 30%, #D8B4FE 75%, #A78BFA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.45;
      color: #D1D5DB;
      letter-spacing: -0.2px;
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .feature-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(18, 12, 34, 0.65);
      border: 1px solid rgba(167, 139, 250, 0.25);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #E2E8F0;
    }
    .feature-badge svg {
      width: 14px;
      height: 14px;
      color: #A78BFA;
    }

    /* Right Visual Area */
    .content-right {
      position: relative;
      z-index: 2;
      width: 380px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      border-radius: 54px;
      box-shadow: 
        0 24px 60px -12px rgba(124, 58, 237, 0.55),
        0 0 40px rgba(167, 139, 250, 0.35);
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.16);
      transform: perspective(1000px) rotateY(-8deg) rotateX(4deg);
      transition: all 0.3s ease;
    }

    .icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Floating UI cards */
    .floating-card {
      position: absolute;
      background: rgba(15, 10, 28, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      font-family: 'Plus Jakarta Sans', sans-serif;
      z-index: 3;
    }
    .floating-card-1 {
      top: 40px;
      left: 10px;
      animation: float1 4s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      bottom: 45px;
      right: 15px;
      animation: float2 4.5s ease-in-out infinite alternate;
    }
    .check-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #10B981;
      background: rgba(16, 185, 129, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .check-circle::after {
      content: '✓';
      font-size: 11px;
      font-weight: 800;
      color: #10B981;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #F3F4F6;
    }
    .card-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(139, 92, 246, 0.2);
      color: #C4B5FD;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>

  <div class="content-left">
    <div class="brand-pill">
      <span class="brand-pill-dot"></span>
      Self-Hosted • Privacy First
    </div>
    <h1 class="title">Guanaco</h1>
    <p class="subtitle">Fast, elegant, and secure task management crafted for your Vikunja server.</p>
    
    <div class="badges-row">
      <div class="feature-badge">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        Zero Telemetry
      </div>
      <div class="feature-badge">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Instant Offline Sync
      </div>
      <div class="feature-badge">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
        Smart NLP Capture
      </div>
      <div class="feature-badge">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h7"/></svg>
        Subtasks & Projects
      </div>
    </div>
  </div>

  <div class="content-right">
    <div class="floating-card floating-card-1">
      <div class="check-circle"></div>
      <span class="card-title">Launch v1.0.6 release</span>
      <span class="card-tag">#release</span>
    </div>

    <div class="icon-wrapper">
      <img src="../icon.png" alt="Guanaco App Icon" />
    </div>

    <div class="floating-card floating-card-2">
      <div class="check-circle"></div>
      <span class="card-title">Sync all projects</span>
      <span class="card-tag">@ready</span>
    </div>
  </div>
</body>
</html>
