name: Release Android Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: 'Attach APK + SHA256SUMS to a GitHub Release for the current version tag'
        required: false
        type: boolean
        default: false
      play_store_track:
        description: 'Optional Google Play track upload (requires PLAY_SERVICE_ACCOUNT_JSON secret)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'internal'
          - 'alpha'
          - 'beta'
          - 'production'

# Default to zero permissions across all jobs; grant minimal per-job scopes explicitly
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  DO_NOT_TRACK: '1'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"'

jobs:
  verify-matrix:
    name: Gate — Typecheck & Test (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        tz:
          - UTC
          - America/Los_Angeles
          - Asia/Tokyo
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout repository (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked npm dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run test suite (${{ matrix.tz }})
        run: npm test

  build-android:
    name: Build & Audit Signed Android Binary
    needs: verify-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      built: ${{ steps.signing_check.outputs.configured }}
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      apk_filename: ${{ steps.meta.outputs.apk_filename }}

    steps:
      - name: Checkout repository (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Android signing secrets availability
        id: signing_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_KEYSTORE_B64: ${{ secrets.GUANACO_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PW: ${{ secrets.GUANACO_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.GUANACO_KEY_ALIAS != '' }}
          HAS_KEY_PW: ${{ secrets.GUANACO_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE_B64" = "true" ] && [ "$HAS_KEYSTORE_PW" = "true" ] && [ "$HAS_KEY_ALIAS" = "true" ] && [ "$HAS_KEY_PW" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Missing Android release signing secrets. Configure GUANACO_KEYSTORE_BASE64, GUANACO_KEYSTORE_PASSWORD, GUANACO_KEY_ALIAS, and GUANACO_KEY_PASSWORD under Repository Settings -> Secrets and variables -> Actions."
            exit 1
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are not configured yet in Repository Settings -> Secrets and variables -> Actions. Skipping binary packaging until secrets are added."
          fi

      - name: Set up Node.js
        if: steps.signing_check.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Temurin JDK 21
        if: steps.signing_check.outputs.configured == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle with dependency caching
        if: steps.signing_check.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Verify version consistency across manifest files and Git tag
        if: steps.signing_check.outputs.configured == 'true'
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const verTs = fs.readFileSync("src/constants/version.ts", "utf8");
            const gradle = fs.readFileSync("android/app/build.gradle", "utf8");

            const vPkg = pkg.version;
            const vApp = app.expo?.version;
            const codeApp = app.expo?.android?.versionCode;
            const vTsMatch = verTs.match(/APP_VERSION\s*=\s*\x27([^\x27]+)\x27/);
            const codeTsMatch = verTs.match(/APP_BUILD_NUMBER\s*=\s*(\d+)/);
            const vGradleMatch = gradle.match(/versionName\s+"([^"]+)"/);
            const codeGradleMatch = gradle.match(/versionCode\s+(\d+)/);

            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(vPkg)) {
              throw new Error(`Invalid semver in package.json: ${vPkg}`);
            }
            if (vPkg !== vApp || vPkg !== vTsMatch?.[1] || vPkg !== vGradleMatch?.[1]) {
              throw new Error(`Version mismatch: package.json=${vPkg}, app.json=${vApp}, version.ts=${vTsMatch?.[1]}, build.gradle=${vGradleMatch?.[1]}`);
            }
            if (String(codeApp) !== codeTsMatch?.[1] || String(codeApp) !== codeGradleMatch?.[1]) {
              throw new Error(`Build number mismatch: app.json=${codeApp}, version.ts=${codeTsMatch?.[1]}, build.gradle=${codeGradleMatch?.[1]}`);
            }
            if (process.env.REF_TYPE === "tag" && process.env.REF_NAME !== `v${vPkg}`) {
              throw new Error(`Git tag "${process.env.REF_NAME}" does not match app version "v${vPkg}"`);
            }

            const releaseTag = process.env.REF_TYPE === "tag" ? process.env.REF_NAME : `v${vPkg}`;
            const apkFilename = `guanaco-${releaseTag}-android.apk`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${vPkg}\nrelease_tag=${releaseTag}\napk_filename=${apkFilename}\n`);
            console.log(`Verified consistent release metadata: ${releaseTag} (versionCode ${codeApp})`);
          '

      - name: Install locked npm dependencies
        if: steps.signing_check.outputs.configured == 'true'
        run: npm ci

      - name: Materialize ephemeral signing keystore in isolated temp storage
        if: steps.signing_check.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.GUANACO_KEYSTORE_BASE64 }}
        run: |
          umask 077
          KEYSTORE_TMP="${RUNNER_TEMP}/guanaco-release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_TMP"
          chmod 600 "$KEYSTORE_TMP"
          echo "GUANACO_KEYSTORE_FILE=${KEYSTORE_TMP}" >> "$GITHUB_ENV"

      - name: Build signed Android Release APK (and AAB when publishing to Play Store)
        if: steps.signing_check.outputs.configured == 'true'
        env:
          EXPO_OFFLINE: '1'
          PLAY_TRACK: ${{ inputs.play_store_track || 'none' }}
          GUANACO_KEYSTORE_PASSWORD: ${{ secrets.GUANACO_KEYSTORE_PASSWORD }}
          GUANACO_KEY_ALIAS: ${{ secrets.GUANACO_KEY_ALIAS }}
          GUANACO_KEY_PASSWORD: ${{ secrets.GUANACO_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ "$PLAY_TRACK" != "none" ]; then
            ./gradlew --no-daemon --no-build-scan assembleRelease bundleRelease
          else
            ./gradlew --no-daemon --no-build-scan assembleRelease
          fi

      - name: Audit compiled APK signature and zero-telemetry manifest guarantees
        if: steps.signing_check.outputs.configured == 'true'
        env:
          APK_FILENAME: ${{ steps.meta.outputs.apk_filename }}
        run: |
          APK_RAW="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_RAW" ]; then
            echo "::error::Expected signed release APK not found at $APK_RAW"
            exit 1
          fi

          # Locate apksigner and apkanalyzer from preinstalled Android SDK
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer | sort -V | tail -n 1)"

          echo "Verifying APK v2/v3 cryptographic signature..."
          "$APKSIGNER" verify --verbose "$APK_RAW"

          if [ -n "$APKANALYZER" ]; then
            echo "Auditing merged release AndroidManifest.xml for privacy & zero-telemetry invariants..."
            MERGED_MANIFEST="$("$APKANALYZER" manifest print "$APK_RAW")"

            echo "$MERGED_MANIFEST" | grep -q 'android:allowBackup="false"' || {
              echo "::error::Privacy audit failed: android:allowBackup=\"false\" missing in release APK!"
              exit 1
            }

            for FORBIDDEN in \
              "com.google.android.gms.permission.AD_ID" \
              "android.permission.ACCESS_FINE_LOCATION" \
              "android.permission.ACCESS_COARSE_LOCATION" \
              "android.permission.READ_CONTACTS" \
              "com.google.android.c2dm.permission.RECEIVE" \
              "com.google.firebase.messaging.FirebaseMessagingService" \
              "com.google.android.datatransport.runtime.backends.TransportBackendDiscovery"; do
              if echo "$MERGED_MANIFEST" | grep -Fq "$FORBIDDEN"; then
                echo "::error::Privacy audit failed: forbidden permission/component '$FORBIDDEN' detected in compiled APK!"
                exit 1
              fi
            done
            echo "✓ Merged manifest passed zero-telemetry and permission audit."
          fi

          mkdir -p release-dist
          cp "$APK_RAW" "release-dist/${APK_FILENAME}"
          (
            cd release-dist
            sha256sum "${APK_FILENAME}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Optional upload to Google Play Console (private TLS channel only)
        if: ${{ steps.signing_check.outputs.configured == 'true' && (inputs.play_store_track || 'none') != 'none' }}
        env:
          PLAY_TRACK: ${{ inputs.play_store_track }}
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SA_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is required when play_store_track is set."
            exit 1
          fi
          umask 077
          SA_TMP="${RUNNER_TEMP}/play-service-account.json"
          printf '%s' "$PLAY_SA_JSON" > "$SA_TMP"
          chmod 600 "$SA_TMP"
          PLAY_SERVICE_ACCOUNT_PATH="$SA_TMP" node scripts/publish-play-store.js \
            --track "$PLAY_TRACK" \
            --aab android/app/build/outputs/bundle/release/app-release.aab

      - name: Shred ephemeral signing & service-account credentials
        if: always()
        run: |
          for SECRET_FILE in "${RUNNER_TEMP}/guanaco-release.keystore" "${RUNNER_TEMP}/play-service-account.json"; do
            if [ -f "$SECRET_FILE" ]; then
              shred -u "$SECRET_FILE" 2>/dev/null || rm -f "$SECRET_FILE"
            fi
          done

      - name: Upload verified public APK & SHA-256 checksum artifact
        if: steps.signing_check.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guanaco-android-release
          path: |
            release-dist/*.apk
            release-dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-github-release:
    name: Attest Provenance & Publish GitHub Release
    needs: build-android
    if: ${{ needs.build-android.outputs.built == 'true' && (github.ref_type == 'tag' || inputs.publish_github_release == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guanaco-android-release
          path: release-dist

      - name: Generate cryptographic SLSA build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-dist/*.apk'

      - name: Create or update GitHub Release via first-party GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build-android.outputs.release_tag }}
          APK_FILENAME: ${{ needs.build-android.outputs.apk_filename }}
        run: |
          CHECKSUM_LINE="$(cat release-dist/SHA256SUMS.txt)"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat <<EOF > "$NOTES_FILE"
          ### Direct Android Download
          - **APK:** \`${APK_FILENAME}\` (signed universal \`arm64-v8a\` / \`armeabi-v7a\` build)
          - **SHA-256:** \`${CHECKSUM_LINE}\`

          Verify build provenance with the [GitHub CLI](https://cli.github.com/):
          \`\`\`bash
          gh attestation verify "${APK_FILENAME}" --repo "${REPO}"
          \`\`\`
          EOF

          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release-dist/${APK_FILENAME}" \
              "release-dist/SHA256SUMS.txt" \
              --clobber \
              --repo "$REPO"
          else
            gh release create "$RELEASE_TAG" \
              "release-dist/${APK_FILENAME}" \
              "release-dist/SHA256SUMS.txt" \
              --title "Guanaco ${RELEASE_TAG}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes \
              --verify-tag \
              --repo "$REPO"
          fi
